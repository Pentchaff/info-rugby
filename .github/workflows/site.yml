name: Collecte et déploiement

on:
  push:
    branches: [main]
  schedule:
    # Toutes les 15 min, à des minutes « impaires » (les créneaux :00 sont souvent retardés).
    # Le collecteur décide lui-même s'il y a quelque chose à faire (match en cours, résumé à chercher,
    # collecte complète toutes les 6 h) ; sinon il s'arrête en quelques secondes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de collecte'
        type: choice
        options: [auto, full, light, probe]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collecte des données
        id: collect
        run: npx tsx collector/index.ts ${{ github.event.inputs.mode || 'auto' }}

      - name: Enregistrement des données
        id: commit
        if: steps.collect.outputs.ran == 'true' || github.event.inputs.mode == 'probe'
        run: |
          git config user.name "info-rugby-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Données : mise à jour automatique"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build du site
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        with:
          path: dist

      - name: Déploiement
        id: deploy
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
